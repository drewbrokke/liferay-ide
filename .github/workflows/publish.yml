name: Publish

on:
  push:
    branches:
      - master
    paths-ignore:
      - '*.commits'
      - '*.markdown'
      - '**/*.markdown'

env:
  LC_ALL: en_US.UTF-8

jobs:
  Publish:
    if: (github.repository == 'liferay/liferay-ide')
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout liferay-ide
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'
          cache: maven
      - name: Build repository
        shell: bash
        run: |
          ./build-updatesite.sh
      - name: Upload p2 repository
        shell: bash
        run: |
          ./build/com.liferay.ide-repository/deployToGCS.sh ./build/com.liferay.ide-repository/target/repository/ eclipse liferay-ide update-snapshot